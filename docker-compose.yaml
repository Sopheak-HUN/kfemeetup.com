name: "kfe-app"
version: "2"
services:
  client:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev
    user: node
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: npm run dev